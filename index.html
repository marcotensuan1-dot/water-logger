<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Tracker App</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script src="./scripts/index.js" defer></script>
</head>

<body>
    <div class="title">
        <button id="settings-btn">
            <img src="./assets/images/settings.png" alt="Settings Button">
        </button>

        <!--Settings Menu-->
        <div id="settings-modal" class="modal">
            <!--Modal content-->
            <div class="modal-content">
                <h2 id="settings-header">Settings</h2>

                <!-- Water Goal -->
                <label style="font-size: 20px">Daily Water Goal: </label><br>
                <input id="custom-daily-goal" type="text" name="water goal" placeholder="128"><br>

                <!-- Change Water Color-->
                <label style="font-size: 20px">Water Color</label><br>

                <select name="waterColors" id="colorSelector" style="font-size: 20px" >
                    <option value="" disabled selected hidden>ex: Blue</option>
                    <option value="dodgerblue">Blue</option>
                    <option value="green">Green</option>
                    <option value="red">Red</option>
                    <option value="pink">Pink</option>
                </select>
                <br>
                

                <!-- Close Button -->
                <button id="close-modal">Close</button>
            </div>
        </div>

        <h1>Water Tracker</h1><br>
        <h2 id="completion-title">Goal Accomplished !!!</h2>
    </div>

    <div class="outer-cup">
        <div class="inner-cup"></div>
    </div>

    <div class="control-panel">
        <p id="current-intake">0 / 128oz (0%)</p>

        <div class="control-buttons">

            <button id="eight-oz" class="add-btns">8 oz</button>
            <button id="twelve-oz" class="add-btns">12 oz</button>
            <button id="sixteen-oz" class="add-btns">16 oz</button>
            <br>
            <br>

            <button id="custom-oz" class="add-btns">Custom oz</button>
            <input type="text" id="customWaterAmount" style="display: none;" placeholder="Enter oz">

            <button id="reset-btn">Reset</button>
            <button id="undo-btn">Undo</button>
        </div>
    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@4.5.3/tsparticles.confetti.bundle.min.js">
    </script>

</body>
</html>
