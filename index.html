<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Tracker App</title>
    <link rel="stylesheet" href="styles/styles.css">

    <style>
        .title{
            font-family: sans-serif;
            text-align: center;
        }

        #current-intake{
            font-family: sans-serif;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="title">
        <h1>Water Tracker</h1>
    </div>

    <div class="outer-cup">
        <div class="inner-cup"></div>
    </div>

    <div class="control-panel">
        <p id="current-intake">0 / 128oz (0%)</p>

        <div class="buttons">
            <button id="eight-oz" class="add-btns">8 oz</button>
            <button id="twelve-oz" class="add-btns">12 oz</button>
            <button id="sixteen-oz" class="add-btns">16 oz</button>
            <br>
            <br>
            <button id="custom-oz" class="add-btns">Custom oz</button>
        </div>
    </div>

</body>
</html>
